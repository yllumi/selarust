[package]
name = "mobile-pwa"
description = "Example mobile-first PWA generated with the Selarust metaframework."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
selarust = { workspace = true }
leptos = { workspace = true }
leptos_router = { workspace = true }
leptos_meta = { workspace = true }
serde = { workspace = true, features = ["derive"] }

axum = { workspace = true, optional = true, features = ["macros", "ws"] }
leptos_axum = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = [
    "rt-multi-thread",
    "macros",
    "net",
    "sync",
] }
serde_json = { workspace = true }
tower-http = { workspace = true, optional = true, features = ["compression-gzip", "set-header"] }
sqlx = { version = "0.8", optional = true, default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "macros",
] }
wasm-bindgen = { workspace = true, optional = true }
console_error_panic_hook = { version = "0.1", optional = true }

[build-dependencies]
selarust-build = { workspace = true }

[features]
# Kept empty: `cargo build` alone is only used for tooling/`cargo check`.
default = []

# Everything that only exists on the server.
ssr = [
    "dep:axum",
    "dep:leptos_axum",
    "dep:tokio",
    "dep:tower-http",
    "dep:sqlx",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "selarust/ssr",
]

# The Wasm client that hydrates the server-rendered HTML.
hydrate = [
    "dep:wasm-bindgen",
    "dep:console_error_panic_hook",
    "selarust/hydrate",
]

[package.metadata.leptos]
output-name = "mobile-pwa"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style/main.css"
assets-dir = "public"
site-addr = "127.0.0.1:3000"
reload-port = 3001
browserquery = "defaults"
# `hash-files` sengaja dibiarkan mati: dengan hashing, rebuild CSS inkremental
# saat `cargo leptos watch` berhenti memperbarui nama berkas sehingga HTML
# menunjuk CSS basi. Cache jangka panjang ditangani service worker, dan server
# mengirim `must-revalidate` untuk /pkg agar deploy langsung terpakai.
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"
