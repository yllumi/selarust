[workspace]
resolver = "2"
members = ["crates/sayagi-build", "crates/sayagi", "crates/sayagi-cli", "app"]
# Templates are inert source files that `sayagi new` copies; keep Cargo out of them.
exclude = ["crates/sayagi-cli/templates"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"
repository = "https://example.com/sayagi-rust"

[workspace.dependencies]
sayagi-build = { path = "crates/sayagi-build", version = "0.1.0" }
sayagi = { path = "crates/sayagi", version = "0.1.0" }

leptos = "0.8"
leptos_router = "0.8"
leptos_meta = "0.8"
leptos_axum = "0.8"
axum = "0.8"
tokio = "1"
tower-http = "0.6"
wasm-bindgen = "0.2.106"
serde = "1"
serde_json = "1"

# Size-optimized profile used for the Wasm bundle in release mode.
# Lives in the workspace root because Cargo only reads `[profile]` there.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
